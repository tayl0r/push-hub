name: Deploy

# Test (`pnpm verify`), build and push to GHCR, then deploy through the VPS deploy gate:
#   main -> :dev (deployment push-hub-dev), prod -> :prod (deployment push-hub)
on:
  push:
    branches: [main, prod]
  workflow_dispatch:

# Workflow-level, so build and deploy run as one: a newer push waits for the running run instead of cancelling
# it (GitHub keeps only the newest waiting run). What a cancel does: vps DEPLOY.md, "One deploy at a time per deployment".
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every other job needs this one, so it holds what decides whether the run goes on at all. It runs none of the
  # commit's code, so a repo whose test stage is a reusable workflow (`uses:`, no steps) keeps it as it is.
  guard:
    # Only main and prod run, even for a workflow_dispatch from another branch: the vps environment refuses other
    # branches, so their image would sit on the tag for the next deploy to ship, and a NAS runner takes only deploy runs.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod'   # full refs: a tag named main or prod doesn't match
    # private repos: their own NAS runner (§ Self-hosted runners); public ones: GitHub's
    runs-on: ${{ github.event.repository.private && 'nas' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref == 'refs/heads/prod'   # only the next step reads the clone, so main skips it
        with:
          persist-credentials: false
          fetch-depth: 0               # the next step reads origin/main

      # prod is promoted from main by fast-forward (`git push origin main:prod`), so what it deploys has already
      # been on main. A commit that never was is refused here, before any of its code runs: its install, its tests
      # or its build.
      - name: Refuse a prod commit that isn't on main
        if: github.ref == 'refs/heads/prod'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::prod is at $GITHUB_SHA, which isn't on main. Promote with \`git push origin main:prod\`."
            exit 1
          fi

  # Tests the landed commit before anything is built. No workflow runs on pull requests, so this is the only run
  # of the repo's checks outside a checkout.
  test:
    needs: guard
    runs-on: ${{ github.event.repository.private && 'nas' || 'ubuntu-latest' }}
    timeout-minutes: 30      # a hung test would otherwise block the deploy queue
    permissions:
      contents: read
    services:
      # The DB suites run against it; test/global-setup.ts migrates it before they start.
      postgres:
        image: postgres:17     # prod's major (vps shared/docker-compose.yml)
        env:
          POSTGRES_DB: pushhub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Over TCP: during first-time init Postgres answers on its socket only, so a socket check would pass
        # before the real server is up.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d pushhub_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/pushhub_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version:`: pnpm comes from package.json's `packageManager` (vps DEPLOY.md, "Dependency cooldown").
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22     # the Dockerfile's node:22; the repo has no .nvmrc
          # Only GitHub's runners restore the pnpm store from the cache: on a NAS runner it's slower than fetching.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  build:
    needs: [guard, test]     # guard by name, so this job never runs without it, whatever the test stage needs
    runs-on: ubuntu-latest
    timeout-minutes: 30      # a hung build would otherwise block the deploy queue
    permissions:
      contents: read
      packages: write
    # Pinned by SHA: this job pushes the tag the gate deploys, so a re-pointed tag could ship a substituted
    # image. Bump a pin only after reading its diff.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the build needs no git token after checkout

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/tayl0r/push-hub:${{ github.ref_name == 'prod' && 'prod' || 'dev' }}

  # The deploy key lives only in this reusable workflow, which a calling job can't add steps to. Give no other
  # job `environment: vps`.
  deploy:
    needs: build
    permissions:
      contents: read
      packages: read         # the server pulls the image with this run's token
    uses: tayl0r/vps-deploy/.github/workflows/deploy.yml@61ad38c841556dbd1c2d9e743d9659d6591a1d2f # v2.0.0
    with:
      # The app's name in the vps app manifest (not always the repo's). From the branch, never a build-job
      # output, which the build could set. A name outside this app's deployments is refused and pages.
      target: ${{ github.ref_name == 'prod' && 'push-hub' || 'push-hub-dev' }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
