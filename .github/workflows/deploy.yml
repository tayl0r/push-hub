name: Deploy

# Build the image and push it to GHCR, then deploy it through the VPS deploy gate:
#   main -> ghcr.io/tayl0r/push-hub:dev  (deployment push-hub-dev)
#   prod -> ghcr.io/tayl0r/push-hub:prod (deployment push-hub)
# The deploy job logs in with this app's own deploy key, which can only ask the server to redeploy
# push-hub or push-hub-dev. The server picks the image from its own compose and runs the migration
# the vps app manifest names for this app before starting it.
on:
  push:
    branches: [main, prod]
  workflow_dispatch:

# One run at a time per branch, build and deploy together: a newer push waits for the running one instead
# of cancelling it. What a cancel does to a deploy: vps DEPLOY.md, "One deploy at a time per deployment".
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only main and prod build. A workflow_dispatch (or any trigger) from another branch would otherwise
    # push a tag the deploy job then can't deploy (the vps environment allows only main and prod), leaving
    # that tag on an undeployed image for the next deploy to ship.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod'   # full refs: a tag named main or prod doesn't match
    runs-on: ubuntu-latest
    timeout-minutes: 30      # a hung build would otherwise hold the branch's deploy queue for GitHub's 6 hours
    permissions:
      contents: read
      packages: write        # required: GITHUB_TOKEN is read-only by default, can't push to GHCR without this
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/tayl0r/push-hub:${{ github.ref_name == 'prod' && 'prod' || 'dev' }}

  # The deploy key lives only in this job, a reusable workflow that a calling job can't add steps to. The
  # server picks the image and migration; this job names the deployment (vps DEPLOY.md, "How a deploy reaches the server").
  deploy:
    needs: build
    permissions:
      contents: read
      packages: read         # the server pulls the image with this run's token
    uses: tayl0r/vps-deploy/.github/workflows/deploy.yml@61ad38c841556dbd1c2d9e743d9659d6591a1d2f # v2.0.0
    with:
      # The app's name in the vps app manifest (not always the repo's): <app> from prod, <app>-dev from main.
      # From the branch, never a build-job output, which the build could set. A name outside this app's
      # deployments is refused, and pages.
      target: ${{ github.ref_name == 'prod' && 'push-hub' || 'push-hub-dev' }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
