name: Deploy

# Build the image, push it to GHCR, then deploy over SSH by delegating to the
# fleet's shared /opt/apps/deploy.sh on the VPS (canonical copy: tayl0r/vps
# deploy/app-deploy.sh) — one isolated GHCR login, a single retried pull, the
# migrate, then `up -d --pull never` + image prune, all owned by that script.
#   main -> ghcr.io/tayl0r/push-hub:dev  (deploy dir push-hub-dev)
#   prod -> ghcr.io/tayl0r/push-hub:prod (deploy dir push-hub)
# Host and SSH credentials are host-side config, supplied only as GitHub
# Environment secrets (see the "dev" / "prod" environments in repo settings);
# the per-env deploy dir is the plain DIR workflow env below.
on:
  push:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    env:
      IMAGE_TAG: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
      DIR: ${{ github.ref_name == 'prod' && 'push-hub' || 'push-hub-dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/tayl0r/push-hub:${{ env.IMAGE_TAG }}

      - name: Migrate and deploy
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/tayl0r/push-hub:${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE,DIR
          # Shared fleet deploy logic lives in /opt/apps/deploy.sh on the VPS
          # (canonical copy: tayl0r/vps deploy/app-deploy.sh) — isolated GHCR
          # login, single pull with retry, migrate, then `up -d --pull never`,
          # then image prune. Args 3+ are this app's migrate command; the script
          # runs it in the freshly pulled image (which carries devDeps + src/ —
          # see Dockerfile) on the apps_internal network with /opt/apps/$DIR/.env.
          script: |
            export GITHUB_TOKEN GITHUB_ACTOR
            /opt/apps/deploy.sh "$DIR" "$IMAGE" pnpm db:migrate
